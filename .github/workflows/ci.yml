name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check emporio_agent/ tests/

      - name: Testes (offline — sem chamadas de LLM)
        env:
          # Garante que nenhum teste tente chamar a API real
          OPENAI_API_KEY: ""
          ENABLE_EMBEDDINGS: "false"
        # python -m pytest adiciona a raiz do projeto ao sys.path, tornando o
        # pacote `emporio_agent` importável pelo conftest (pytest puro não faz isso).
        run: python -m pytest tests/ -v
